{% extends "base.html" %}

{% block title %}Reset Email Sent{% endblock %}

{% block content %}
<div class="hero">
    <div>
        <span class="meta">Check Your Email</span>
        <h1>Password reset sent.</h1>
        <p>If an active account exists for that email, you'll receive a link to choose a new password.</p>
    </div>

    <div class="actions">
        <a href="{% url 'login' %}" class="button secondary">Back to login</a>
    </div>
</div>
{% endblock %}
